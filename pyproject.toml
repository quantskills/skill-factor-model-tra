[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tra-alpha"
version = "0.1.0"
description = "Standalone Temporal Routing Adaptor model for multi-factor alpha synthesis"
readme = "README.en.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=12",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
tra-alpha = "tra_alpha.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
