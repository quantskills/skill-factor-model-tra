name: Validate skill

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: quantskills/registry
          path: registry
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install package and registry validation dependencies
        run: |
          python -m pip install -e . pytest
          python -m pip install -r registry/requirements-dev.txt
      - name: Validate QuantSkills registry contract
        run: python registry/scripts/validate_skill.py . --contract-mode enforce
      - name: Validate qsh form
        run: node scripts/validate-qsh-form.mjs SKILL.md
      - name: Run synthetic smoke test
        run: python scripts/run_smoke.py
      - name: Run unit tests
        run: python -m pytest -q
